name: Bug report
description: Report a reproducible problem with DiskMosaic.
title: "[Bug]: "
labels: [bug]
body:
  - type: dropdown
    id: edition
    attributes:
      label: Edition
      options:
        - DiskMosaic
        - DiskMosaic Light
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Version and operating system
      placeholder: "1.0.0; Windows 11 x64 or Linux distribution and version"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use synthetic filenames and remove private paths or credentials.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
